<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>105 | Sebastian Arcade</title>
    <style>
        /* Base Page Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            background-color: #262626;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar Navigation Layout */
        #sidebar {
            width: 300px;
            background-color: #1a1a1a;
            border-right: 1px solid #333333;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        #sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #333333;
        }
        #sidebar-header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 10px;
        }
        #search-bar {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444444;
            background-color: #2c2c2c;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        #search-bar:focus {
            border-color: #0076ff;
        }

        /* Game List Menu Container */
        #game-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .game-item {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 5px;
            background-color: #242424;
            color: #cccccc;
            text-align: left;
            border: 1px solid #333333;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .game-item:hover {
            background-color: #2d2d2d;
            color: #ffffff;
            border-color: #555555;
        }
        .game-item.active {
            background-color: #0076ff;
            color: #ffffff;
            border-color: #0076ff;
            font-weight: 600;
        }

        /* Main Screen Frame Window */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            background-color: #262626;
        }
        #arcade-frame {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #1e1e1e;
        }
        #placeholder-text {
            margin: auto;
            text-align: center;
            color: #666666;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Left Navigation Sidebar -->
    <div id="sidebar">
        <div id="sidebar-header">
            <h1>105 | Sebastian</h1>
            <input type="text" id="search-bar" placeholder="Search 200+ games..." oninput="filterGames()">
        </div>
        <div id="game-list">
            <!-- Core Featured Catalog Examples -->
            <button class="game-item" onclick="loadGame('1v1lol/index.html', this)">🔫 1v1.LOL</button>
            <button class="game-item" onclick="loadGame('MonkeyMart/index.html', this)">🐒 Monkey Mart</button>
            <button class="game-item" onclick="loadGame('cluster-rush/index.html', this)">🚚 Cluster Rush</button>
            <button class="game-item" onclick="loadGame('10-minutes-till-dawn/index.html', this)">🏃‍♂️ 10 Minutes Till Dawn</button>
            <button class="game-item" onclick="loadGame('Rocket-League/index.html', this)">⚽ Rocket League 2D</button>
            <button class="game-item" onclick="loadGame('a-dance-of-fire-and-ice/index.html', this)">🎵 A Dance of Fire and Ice</button>
            <button class="game-item" onclick="loadGame('2048/index.html', this)">🔢 2048</button>
            <button class="game-item" onclick="loadGame('DogeMiner/index.html', this)">🐕 Doge Miner</button>
            <button class="game-item" onclick="loadGame('backrooms/index.html', this)">👁️ The Backrooms</button>
            <button class="game-item" onclick="loadGame('bitlife/index.html', this)">💼 BitLife</button>
            <button class="game-item" onclick="loadGame('bloonstd2/index.html', this)">🎈 Bloons TD 2</button>
            
            <!-- Add any extra game buttons here using format:
            <button class="game-item" onclick="loadGame('FOLDER_NAME/index.html', this)">Game Name</button> 
            -->
        </div>
    </div>

    <!-- Right Screen Framework Display Window -->
    <div id="main-content">
        <div id="placeholder-text">Select a game from the sidebar menu to start playing</div>
        <iframe id="arcade-frame" src="" style="display: none;" allowfullscreen></iframe>
    </div>

    <!-- Interactive Execution Logic -->
    <script>
        // Function to smoothly load the game folder into the iframe screen container
        function loadGame(gameUrl, element) {
            const iframe = document.getElementById('arcade-frame');
            const placeholder = document.getElementById('placeholder-text');
            
            // Remove active coloring from previously clicked items
            const items = document.querySelectorAll('.game-item');
            items.forEach(item => item.classList.remove('active'));
            
            // Activate current selection styling
            element.classList.add('active');
            
            // Swap placeholder display with functional iframe target container
            placeholder.style.display = 'none';
            iframe.style.display = 'block';
            iframe.src = gameUrl;
        }

        // Live filtration search tool script configuration
        function filterGames() {
            const input = document.getElementById('search-bar').value.toLowerCase();
            const buttons = document.getElementsByClassName('game-item');
            
            for (let i = 0; i < buttons.length; i++) {
                const gameName = buttons[i].innerText.toLowerCase();
                if (gameName.includes(input)) {
                    buttons[i].style.display = "block";
                } else {
                    buttons[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
